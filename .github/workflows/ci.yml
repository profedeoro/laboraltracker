name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent:
              - 'apps/agent/**'
            platform:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'

  agent:
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo test
        run: cargo test --manifest-path apps/agent/src-tauri/Cargo.toml

  platform:
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma Client is a generated, non-versioned artifact: regenerate it from
      # the schema before anything compiles against the model types (e.g. seed.ts
      # imports RoleKey). Without this, a fresh install ships only the base stub.
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api test
      - run: pnpm --filter api build
      - run: pnpm --filter web build
